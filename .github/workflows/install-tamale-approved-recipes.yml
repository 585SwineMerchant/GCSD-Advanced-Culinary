name: Install approved tamale recipes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-tamale-approved-recipes.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add tamale recipe library script to student site
        shell: python
        run: |
          from pathlib import Path
          path = Path('site/index.html')
          text = path.read_text()
          old = '  <script src="./app.js"></script>\n  <script src="./live-event.js"></script>'
          new = '  <script src="./app.js"></script>\n  <script src="./tamale-approved-recipes.js"></script>\n  <script src="./live-event.js"></script>'
          if './tamale-approved-recipes.js' not in text:
              if old not in text:
                  raise SystemExit('Expected script block not found in site/index.html')
              text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Remove one-time installer and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-tamale-approved-recipes.yml
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Expose approved tamale recipes in Advanced Culinary"
            git push origin main
          fi
